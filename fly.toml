app = "region-softball"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  TZ = "America/New_York"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  path = "/api/health"
  interval = "15s"
  timeout = "5s"

[mounts]
  source = "pb_data"
  destination = "/data"
